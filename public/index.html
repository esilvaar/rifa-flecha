<!DOCTYPE html>

        img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com https://*.google.com https://*.gstatic.com https:;

        frame-src 'self' https://*.google.com https://accounts.google.com https://*.supabase.co;
      " />

  <meta property="og:title" content="Sistema de Gestión de Rifas" />

  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Logo Sistema de Rifas" />
